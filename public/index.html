<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Radio Web">
<title>Radio Web</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Radio%20Web%22%2C%22short_name%22%3A%22Radio%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<style>
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}
input { user-select: text; -webkit-user-select: text; }
html, body {
  height: 100%; width: 100%;
  background: #1a1a1a; overflow: hidden;
  overscroll-behavior: none;
}
#moldura {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 375px; height: 720px;
  max-height: calc(100vh - 40px);
  background: #000;
  border-radius: 32px;
  overflow: hidden;
  box-shadow: 0 0 0 6px #2a2a2a, 0 0 0 8px #111, 0 30px 80px rgba(0,0,0,0.7);
  display: flex; flex-direction: column;
}
@media (max-width: 500px) {
  #moldura {
    top: 0; left: 0; transform: none;
    width: 100%; height: 100%; max-height: 100%;
    border-radius: 0; box-shadow: none;
  }
  body { background: #000; }
}
#app {
  flex: 1; position: relative; overflow: hidden;
  background: #000; color: #fff;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.tela { position: absolute; inset: 0; display: none; flex-direction: column; }
.tela.ativa { display: flex; }

#telaLogin {
  background: #000;
  align-items: center; justify-content: center;
  gap: 50px; padding: 24px;
}
.tituloLogin { font-size: 64px; font-weight: 900; color: #e30613; letter-spacing: 2px; }
.campoLogin {
  width: 100%; max-width: 280px;
  padding: 14px 20px; border-radius: 40px; border: none;
  background: #d9d9d9; color: #e30613;
  font-size: 15px; font-weight: bold;
  text-align: center; outline: none;
}
.campoLogin::placeholder { color: #e30613; font-weight: bold; }
.btnCriar {
  background: #1fbf3f; color: #000; border: none;
  font-size: 20px; font-weight: 900;
  padding: 12px 36px; border-radius: 40px;
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 0 #0a7a22;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btnCriar:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a7a22; }
.btnCriar .seta { font-size: 24px; color: #fff; }

#telaPrincipal {
  background: #7a7a7a;
  align-items: center; justify-content: space-between;
  padding: 16px; gap: 8px;
}
.topoPrincipal { width: 100%; display: flex; justify-content: flex-end; gap: 8px; }
.btnTopo {
  background: #d9d9d9; color: #000; border: none;
  font-size: 13px; font-weight: 900;
  padding: 7px 12px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s, transform 0.1s;
}
.btnTopo:active { background: #bbb; transform: scale(0.96); }
.btnTopo svg { width: 16px; height: 16px; display: block; stroke: #000; flex-shrink: 0; }

.tituloRadio {
  font-size: 44px; font-weight: 900;
  color: #1a1a1a; text-align: center;
  line-height: 1; margin-top: 20px;
}
.statusAoVivo {
  background: #d9d9d9; color: #000;
  font-size: 14px; font-weight: 900;
  padding: 6px 22px; border-radius: 20px;
  letter-spacing: 1px;
}
.statusAoVivo.off { background: #555; color: #ccc; }

.btnPlay {
  width: 180px; height: 180px;
  border-radius: 50%;
  border: 6px solid #d9d9d9;
  background: #d9d9d9;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.1s;
}
.btnPlay:active { transform: scale(0.95); }
.btnPlay::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #e8a87c; }
.iconePlay { position: relative; z-index: 2; font-size: 46px; color: #1a1a1a; margin-left: 8px; }
.btnPlay.tocando .iconePlay { font-size: 0; }
.btnPlay.tocando .iconePlay::before {
  content: "❚❚"; font-size: 36px;
  letter-spacing: 4px; margin-left: 0;
}
.nomeMusica {
  background: #d9d9d9; color: #1a1a1a;
  font-size: 14px; font-weight: 900;
  padding: 12px 20px; border-radius: 30px;
  width: 100%; max-width: 280px;
  text-align: center; letter-spacing: 0.5px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  margin-bottom: 10px;
}

#popupChat {
  position: absolute;
  bottom: 16px; right: 16px;
  width: 300px; height: 380px;
  background: #d9d9d9; border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  display: none; flex-direction: column;
  overflow: hidden; z-index: 100;
  animation: subirPopup 0.25s ease-out;
}
#popupChat.ativo { display: flex; }
@keyframes subirPopup {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@media (max-width: 360px) {
  #popupChat {
    width: calc(100% - 24px);
    right: 12px; bottom: 12px;
    height: 60%;
  }
}
.topoChat {
  background: #4a4a4a; color: #fff;
  display: flex; align-items: center;
  padding: 10px 12px; gap: 10px; flex-shrink: 0;
}
.btnX {
  background: #e30613; color: #fff; border: none;
  width: 32px; height: 32px;
  border-radius: 6px; font-size: 16px;
  font-weight: 900; cursor: pointer; flex-shrink: 0;
}
.btnX:active { background: #a00410; }
.tituloChat { font-size: 22px; font-weight: 900; line-height: 1; }
.subtituloChat {
  display: flex; flex-direction: column;
  font-size: 10px; font-weight: bold;
  color: #ccc; margin-left: auto;
  text-align: right; line-height: 1.3;
}
.areaMensagens {
  flex: 1; overflow-y: auto;
  padding: 10px; display: flex; flex-direction: column;
  gap: 6px; background: #d9d9d9;
  -webkit-overflow-scrolling: touch;
}
.msg {
  max-width: 85%; padding: 7px 10px;
  border-radius: 10px; font-size: 13px;
  word-wrap: break-word; line-height: 1.3;
}
.msg.outro { background: #fff; color: #000; align-self: flex-start; border-bottom-left-radius: 2px; }
.msg.eu { background: #4a4a4a; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
.msg .autor { font-size: 10px; font-weight: 900; display: block; margin-bottom: 2px; opacity: 0.75; }

.rodapeChat {
  display: flex; align-items: center;
  gap: 6px; padding: 8px 10px;
  background: #4a4a4a; flex-shrink: 0;
}
.campoMensagem {
  flex: 1; padding: 10px 14px;
  border-radius: 20px; border: none;
  font-size: 14px; font-weight: bold;
  outline: none; background: #d9d9d9;
  color: #000; min-width: 0;
}
.campoMensagem::placeholder { color: #555; font-weight: bold; }
.btnEnviar {
  background: #f4a0b8; color: #000; border: none;
  width: 40px; height: 40px;
  border-radius: 50%; font-size: 14px;
  font-weight: 900; cursor: pointer; flex-shrink: 0;
}
.btnEnviar:active { background: #d97f97; }

#modalSair {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.65);
  display: none; align-items: center;
  justify-content: center;
  z-index: 200; padding: 20px;
  animation: fadeIn 0.2s ease-out;
}
#modalSair.ativo { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#modalSair .caixa {
  background: #fff; color: #000;
  width: 100%; max-width: 300px;
  border-radius: 16px;
  padding: 22px 20px 18px 20px;
  text-align: center;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  animation: subirCaixa 0.25s ease-out;
}
@keyframes subirCaixa {
  from { transform: scale(0.9); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
#modalSair .caixa h3 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
#modalSair .caixa p { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.4; }
#modalSair .botoes { display: flex; justify-content: center; gap: 10px; }
#modalSair .btnNao {
  background: #f4a0b8; color: #000; border: none;
  font-size: 14px; font-weight: 900;
  padding: 10px 22px; border-radius: 20px;
  cursor: pointer;
}
#modalSair .btnSim {
  background: #7a2a5a; color: #fff; border: none;
  font-size: 14px; font-weight: 900;
  padding: 10px 22px; border-radius: 20px;
  cursor: pointer;
}

.statusConexao {
  position: absolute; top: 8px; left: 8px;
  z-index: 9999; padding: 3px 8px;
  border-radius: 10px; font-size: 10px; font-weight: bold;
  background: #666; color: #fff;
}
.statusConexao.on { background: #1fbf3f; }
.statusConexao.off { background: #ff2a2a; }
</style>
</head>
<body>

<div id="moldura">
  <div id="app">

    <div class="statusConexao off" id="statusConexao">● off</div>

    <section id="telaLogin" class="tela ativa">
      <h1 class="tituloLogin">LOGIN</h1>
      <input
        type="text"
        id="inputUsuario"
        class="campoLogin"
        placeholder="crei seu usuário"
        maxlength="20"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button id="btnCriar" class="btnCriar">
        criar <span class="seta">➜</span>
      </button>
    </section>

    <section id="telaPrincipal" class="tela">
      <header class="topoPrincipal">
        <button id="btnAbrirChat" class="btnTopo" title="Chat">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5C21 16.1944 16.9706 20 12 20C10.8571 20 9.76629 19.8038 8.76142 19.4491L3 21L4.67075 16.1082C4.2419 15.0121 4 13.7902 4 12.5C4 7.80558 8.02944 4 13 4" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 11.5C21 12.639 20.7766 13.7305 20.3725 14.7349L22 19L17.9174 18.0797C16.6494 18.6535 15.2134 19 13.6667 19C9.16475 19 5.5 15.6421 5.5 11.5C5.5 7.35786 9.16475 4 13.6667 4C18.1687 4 21 7.35786 21 11.5Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span>chat</span>
        </button>
        <button id="btnSair" class="btnTopo" title="Sair da conta">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17L21 12L16 7" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>sair</span>
        </button>
      </header>

      <h1 class="tituloRadio">Radio web</h1>
      <div class="statusAoVivo" id="statusAoVivo">offline</div>

      <button id="btnPlay" class="btnPlay" aria-label="Tocar">
        <span class="iconePlay">▶</span>
      </button>

      <div class="nomeMusica" id="nomeMusica">nome da musica</div>
    </section>

    <div id="popupChat">
      <header class="topoChat">
        <button id="btnFecharChat" class="btnX">✕</button>
        <h2 class="tituloChat">chat</h2>
        <div class="subtituloChat">
          <span>chat radio</span>
          <span>mensagem</span>
        </div>
      </header>
      <div class="areaMensagens" id="areaMensagens"></div>
      <footer class="rodapeChat">
        <input
          type="text"
          id="inputMensagem"
          class="campoMensagem"
          placeholder="digita sua mensagem"
          autocomplete="off"
          autocapitalize="sentences"
        >
        <button id="btnEnviar" class="btnEnviar">ok</button>
      </footer>
    </div>

    <div id="modalSair">
      <div class="caixa">
        <h3>Sair da conta?</h3>
        <p>Você tem certeza que deseja sair?<br>Você voltará para a tela de login.</p>
        <div class="botoes">
          <button class="btnNao" id="btnCancelarSair">Não</button>
          <button class="btnSim" id="btnConfirmarSair">Sim, sair</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const API_WS = 'wss://radio-web-api.onrender.com/ws/stream';

/* ==========================================================
   ESTADO
   ========================================================== */
const estado = {
  usuario: '',
  tocando: false,
  conectado: false,
  aoVivo: false,
};

let ws = null;
let wakeLock = null;
let tentativasReconexao = 0;

/* ==========================================================
   PLAYER PCM — Web Audio API com buffer grande
   ========================================================== */
let audioCtx = null;
let proximoInicio = 0;
let bufferSegundos = 0;

const BUFFER_ALVO = 5;       // 🔴 5 segundos de buffer
const KEEPALIVE_MS = 10000;

/* ==========================================================
   DOM
   ========================================================== */
const telaLogin     = document.getElementById('telaLogin');
const telaPrincipal = document.getElementById('telaPrincipal');

const inputUsuario  = document.getElementById('inputUsuario');
const btnCriar      = document.getElementById('btnCriar');

const btnAbrirChat  = document.getElementById('btnAbrirChat');
const btnSair       = document.getElementById('btnSair');
const btnPlay       = document.getElementById('btnPlay');
const statusAoVivo  = document.getElementById('statusAoVivo');
const nomeMusica    = document.getElementById('nomeMusica');

const popupChat     = document.getElementById('popupChat');
const btnFecharChat = document.getElementById('btnFecharChat');
const areaMensagens = document.getElementById('areaMensagens');
const inputMensagem = document.getElementById('inputMensagem');
const btnEnviar     = document.getElementById('btnEnviar');

const modalSair        = document.getElementById('modalSair');
const btnCancelarSair  = document.getElementById('btnCancelarSair');
const btnConfirmarSair = document.getElementById('btnConfirmarSair');

const statusConexaoEl  = document.getElementById('statusConexao');

document.addEventListener('touchmove', (e) => {
  if (!e.target.closest('.areaMensagens')) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

function mostrarTela(tela) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  tela.classList.add('ativa');
}

/* ==========================================================
   WAKE LOCK
   ========================================================== */
async function ativarWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('💡 Wake Lock ativado');
      wakeLock.addEventListener('release', () => console.log('💡 Wake Lock liberado'));
    }
  } catch (err) { console.warn('Wake Lock erro:', err.message); }
}

async function desativarWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
    console.log('💡 Wake Lock desativado');
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    if (estado.tocando && !wakeLock) await ativarWakeLock();
    if (!ws || ws.readyState !== WebSocket.OPEN) conectarWebSocket();
  }
});

/* ==========================================================
   ÁUDIO — inicialização
   ========================================================== */
function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC({
    sampleRate: 48000,
    latencyHint: 'playback',   // 🔴 prioriza estabilidade
  });
  proximoInicio = audioCtx.currentTime + 0.1;
  console.log('🎧 AudioContext PCM iniciado (48kHz)');
}

/* ==========================================================
   TOCAR CHUNK PCM (Int16 → Float32 → agenda)
   ========================================================== */
function tocarChunkPCM(arrayBuffer) {
  if (!estado.tocando) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768;
  }

  const buffer = audioCtx.createBuffer(1, float32.length, audioCtx.sampleRate);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const agora = audioCtx.currentTime;

  // Se o buffer tá muito grande, pula pra frente
  if (proximoInicio > agora + BUFFER_ALVO) {
    console.log('⚠️ Buffer muito grande, pulando');
    proximoInicio = agora + 0.2;
  }

  // Se o buffer esvaziou (atrasou), reinicia
  if (proximoInicio < agora - 0.5) {
    console.log('⚠️ Buffer esvaziou, reiniciando');
    proximoInicio = agora + 0.1;
  }

  const inicio = Math.max(agora + 0.05, proximoInicio);
  source.start(inicio);
  proximoInicio = inicio + buffer.duration;
  bufferSegundos = proximoInicio - agora;
}

/* ==========================================================
   WEBSOCKET
   ========================================================== */
function conectarWebSocket() {
  if (!estado.usuario || estado.usuario.trim() === '') {
    console.log('⏸ Sem usuário definido — WS não conectado');
    return;
  }
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  try {
    const nomeUsuario = encodeURIComponent(estado.usuario.trim());
    ws = new WebSocket(`${API_WS}?role=listener&user=${nomeUsuario}`);
    ws.binaryType = 'arraybuffer';

    ws.addEventListener('open', () => {
      estado.conectado = true;
      tentativasReconexao = 0;
      atualizarStatusConexao(true);
      console.log('✅ Conectado como', estado.usuario);
    });

    ws.addEventListener('message', (event) => {
      if (typeof event.data === 'string') {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'meta') {
            atualizarStatusAoVivo(!!msg.live);
            atualizarNomeMusica(msg.title);
            atualizarMediaSession(msg.title);
          }
          if (msg.type === 'chat') {
            const ehMinha = msg.user === estado.usuario;
            const ehDoLocutor = msg.role === 'broadcaster';
            if (ehDoLocutor && !ehMinha) {
              adicionarMensagem({
                autor: msg.user || 'locutor',
                texto: msg.text,
                eu: false,
              });
            }
          }
        } catch (e) { console.warn('Msg inválida:', e); }
      } else {
        if (estado.tocando) tocarChunkPCM(event.data);
      }
    });

    ws.addEventListener('close', () => {
      estado.conectado = false;
      atualizarStatusConexao(false);
      atualizarStatusAoVivo(false);
      tentativasReconexao++;
      const delay = Math.min(500 * Math.pow(2, tentativasReconexao - 1), 3000);
      console.log(`🔄 Reconectando em ${delay}ms...`);
      setTimeout(conectarWebSocket, delay);
    });

    ws.addEventListener('error', (err) => console.warn('WS erro:', err.message));
  } catch (err) {
    console.warn('Erro conexão:', err.message);
    setTimeout(conectarWebSocket, 1000);
  }
}

function desconectarWebSocket() {
  if (ws) { ws.close(); ws = null; }
}

function atualizarStatusConexao(online) {
  statusConexaoEl.textContent = online ? '● on' : '● off';
  statusConexaoEl.className = 'statusConexao ' + (online ? 'on' : 'off');
}

/* ==========================================================
   KEEPALIVE
   ========================================================== */
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    try {
      ws.send(JSON.stringify({ type: 'ping', t: Date.now() }));
    } catch (e) {}
  }
}, KEEPALIVE_MS);

/* ==========================================================
   LOGIN
   ========================================================== */
const usuarioSalvo = localStorage.getItem('radioUsuario');
if (usuarioSalvo) {
  estado.usuario = usuarioSalvo;
  entrarNoApp();
}

btnCriar.addEventListener('click', () => {
  const nome = inputUsuario.value.trim();
  if (!nome) { alert('Digite um nome de usuário!'); return; }
  localStorage.setItem('radioUsuario', nome);
  estado.usuario = nome;
  entrarNoApp();
});

inputUsuario.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btnCriar.click();
});

function entrarNoApp() {
  mostrarTela(telaPrincipal);
  conectarWebSocket();
}

/* ==========================================================
   PRINCIPAL
   ========================================================== */
btnAbrirChat.addEventListener('click', () => {
  popupChat.classList.toggle('ativo');
  if (popupChat.classList.contains('ativo')) {
    setTimeout(() => inputMensagem.focus(), 150);
  }
});

btnSair.addEventListener('click', () => {
  modalSair.classList.add('ativo');
});

btnCancelarSair.addEventListener('click', () => {
  modalSair.classList.remove('ativo');
});

btnConfirmarSair.addEventListener('click', () => {
  modalSair.classList.remove('ativo');
  if (estado.tocando) {
    estado.tocando = false;
    btnPlay.classList.remove('tocando');
  }
  desativarWakeLock();
  popupChat.classList.remove('ativo');
  desconectarWebSocket();
  localStorage.removeItem('radioUsuario');
  estado.usuario = '';
  inputUsuario.value = '';
  mostrarTela(telaLogin);
  setTimeout(() => inputUsuario.focus(), 200);
});

modalSair.addEventListener('click', (e) => {
  if (e.target === modalSair) modalSair.classList.remove('ativo');
});

/* ==========================================================
   PLAY
   ========================================================== */
btnPlay.addEventListener('click', async () => {
  estado.tocando = !estado.tocando;
  btnPlay.classList.toggle('tocando', estado.tocando);

  if (estado.tocando) {
    console.log('▶ Tocando');
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    proximoInicio = audioCtx.currentTime + 0.1;
    await ativarWakeLock();
    registrarMediaSession();
    conectarWebSocket();
  } else {
    console.log('⏸ Pausado');
    await desativarWakeLock();
    proximoInicio = audioCtx ? audioCtx.currentTime : 0;
  }
});

function atualizarStatusAoVivo(aoVivo) {
  estado.aoVivo = aoVivo;
  statusAoVivo.textContent = aoVivo ? 'ao vivo' : 'offline';
  statusAoVivo.classList.toggle('off', !aoVivo);
}

function atualizarNomeMusica(titulo) {
  nomeMusica.textContent = titulo || 'nome da musica';
}

/* ==========================================================
   MEDIA SESSION
   ========================================================== */
function registrarMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Radio Web - Ao Vivo',
    artist: 'Radio Web',
    album: 'Radio Web',
  });
  navigator.mediaSession.setActionHandler('play', () => {
    estado.tocando = true;
    btnPlay.classList.add('tocando');
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    ativarWakeLock();
  });
  navigator.mediaSession.setActionHandler('pause', () => {
    estado.tocando = false;
    btnPlay.classList.remove('tocando');
  });
  navigator.mediaSession.setActionHandler('stop', () => {
    estado.tocando = false;
    btnPlay.classList.remove('tocando');
  });
  navigator.mediaSession.playbackState = 'playing';
}

function atualizarMediaSession(titulo) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: titulo || 'Radio Web - Ao Vivo',
    artist: 'Radio Web',
    album: 'Radio Web',
  });
}

/* ==========================================================
   CHAT
   ========================================================== */
btnFecharChat.addEventListener('click', () => {
  popupChat.classList.remove('ativo');
});

btnEnviar.addEventListener('click', enviarMensagem);
inputMensagem.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') enviarMensagem();
});

function enviarMensagem() {
  const texto = inputMensagem.value.trim();
  if (!texto) return;
  adicionarMensagem({ autor: estado.usuario, texto, eu: true });
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'chat', user: estado.usuario, text: texto }));
  }
  inputMensagem.value = '';
  inputMensagem.focus();
}

function adicionarMensagem({ autor, texto, eu = false }) {
  const div = document.createElement('div');
  div.className = 'msg ' + (eu ? 'eu' : 'outro');
  div.innerHTML = `<span class="autor">${autor}</span>${texto}`;
  areaMensagens.appendChild(div);
  areaMensagens.scrollTop = areaMensagens.scrollHeight;
}

/* ==========================================================
   SERVICE WORKER — PWA
   ========================================================== */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'radio-web-v10';
    self.addEventListener('install', (e) => {
      e.waitUntil(caches.open(CACHE).then(c => c.add('./')));
      self.skipWaiting();
    });
    self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', (e) => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./')))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

/* ==========================================================
   MONITOR
   ========================================================== */
setInterval(() => {
  if (estado.tocando && (!ws || ws.readyState !== WebSocket.OPEN)) {
    console.log('🔧 WS caiu — reconectando...');
    conectarWebSocket();
  }
  if (estado.tocando && !wakeLock && 'wakeLock' in navigator) {
    ativarWakeLock();
  }
}, 3000);
</script>
