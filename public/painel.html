<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel FM — Transmitir Rádio Web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

  #telaLogin {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: #000; gap: 40px;
  }
  #telaLogin h1 { font-size: 90px; font-weight: 900; letter-spacing: 4px; color: #fff; }
  #telaLogin .campo {
    width: 420px; padding: 18px 24px; border-radius: 40px; border: none;
    background: #fff; color: #333; font-size: 18px; font-weight: bold;
    text-align: center; text-transform: uppercase; letter-spacing: 2px; outline: none;
  }
  #telaLogin .campo::placeholder { color: #999; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
  #telaLogin button {
    background: #1fbf3f; border: none; color: #000; font-size: 26px; font-weight: 900;
    padding: 14px 50px; border-radius: 40px; cursor: pointer; letter-spacing: 4px;
    text-transform: uppercase; display: flex; align-items: center; gap: 12px;
  }
  #telaLogin button::after { content: "➜"; font-size: 30px; color: #fff; }

  #telaPainel { display: none; height: 100vh; padding: 10px; background: #000; flex-direction: column; gap: 8px; overflow: hidden; }
  #telaPainel.ativo { display: flex; }

  .topo {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    background: #4a4a4a; border-radius: 12px; padding: 8px 20px; min-height: 76px; gap: 16px; flex-shrink: 0;
  }
  .topo .nomeUsuario {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: 900; color: #fff; white-space: nowrap;
  }
  .topo .esquerda, .topo .direita { display: flex; align-items: center; gap: 12px; }
  .topo .iconeBtn {
    background: transparent; border: none; cursor: pointer; font-size: 30px; color: #fff;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .topo .iconeBtn svg { width: 34px; height: 34px; display: block; }
  .topo .badge {
    position: absolute; top: -4px; right: -8px; background: #1fbf3f; color: #fff;
    font-size: 12px; font-weight: bold; border-radius: 50%;
    min-width: 20px; height: 20px;
    display: none; align-items: center; justify-content: center; padding: 0 4px;
    border: 2px solid #4a4a4a;
  }

  .corpo { display: grid; grid-template-columns: 1fr 380px 1fr; gap: 8px; flex: 1; min-height: 0; }
  .bloco {
    background: #000; border-radius: 12px; padding: 10px;
    display: grid; grid-template-rows: 230px 1fr; gap: 8px; min-height: 0;
  }
  .bloco .cabecalho { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

  .quadroCinza {
    background: #d9d9d9; border-radius: 10px; padding: 8px; overflow-y: auto;
    min-height: 0; height: 100%; position: relative;
  }
  .quadroCinza .btnAddDentro {
    position: absolute; top: 8px; right: 8px; background: #2c2c2c; border: 2px solid #555;
    border-radius: 8px; color: #fff; font-size: 22px; font-weight: bold;
    width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; z-index: 3;
  }
  .tituloDentroQuadro {
    text-align: center; font-size: 30px; font-weight: 900; color: #000;
    padding: 6px 0 10px 0; border-bottom: 2px solid #bbb; margin-bottom: 8px;
  }
  .quadroCinza .item {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
    color: #000; font-size: 12px; font-weight: bold; padding-right: 60px;
  }
  .quadroCinza .item.tocando { background: #b8e6b8; }
  .quadroCinza .item .info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .quadroCinza .item .info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .quadroCinza .item .play {
    width: 26px; height: 26px; background: #000; color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 12px; flex-shrink: 0;
  }
  .quadroCinza .item .apagar {
    color: #ff2a2a; cursor: pointer; font-size: 10px; background: #ffdada;
    padding: 2px 8px; border-radius: 10px;
  }
  .quadroCinza .item .duracao { color: #888; font-size: 10px; margin-left: 6px; }

  .btnQuadrado {
    width: 40px; height: 40px; background: #2c2c2c; border: 2px solid #555; border-radius: 8px;
    color: #fff; font-size: 22px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .linhaVinhetas { display: flex; align-items: center; gap: 8px; }

  .bolinha {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #000; font-size: 16px; border: 3px solid #fff;
    cursor: pointer; flex-shrink: 0;
  }
  .bolinha.amarela { background: #ffd400; }
  .bolinha.verde { background: #1fbf3f; }
  .bolinha.vermelha { background: #ff2a2a; }

  .linhaAoVivo { display: flex; justify-content: center; width: 100%; margin-top: auto; margin-bottom: 4px; }
  .btnAoVivo {
    background: #fff; color: #1a4ed8; font-size: 16px; font-weight: 900;
    padding: 6px 18px; border-radius: 14px; border: 3px solid #1a4ed8;
    cursor: pointer; letter-spacing: 1.5px;
  }
  .btnAoVivo.ligado { background: #1fbf3f; color: #fff; border-color: #1fbf3f; }

  .btnReproduzir {
    background: #fff; color: #1a4ed8; font-size: 11px; font-weight: 900;
    padding: 5px 10px; border-radius: 14px; border: 3px solid #1a4ed8;
    cursor: pointer; width: 130px; text-align: center;
    margin-top: auto; margin-bottom: 4px; align-self: center;
  }
  .btnReproduzir.ligado { background: #1fbf3f; color: #fff; border-color: #1fbf3f; }

  .visor {
    border-radius: 8px; padding: 14px; background: #4fc3f7; border: 4px solid #a020c0;
    display: flex; flex-direction: column; gap: 10px; font-weight: bold; flex: 1;
  }
  .visor .linhaTop {
    display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 18px;
    text-transform: lowercase; text-align: center; color: #000; font-weight: 900;
  }
  .visor .linhaValores { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1; }
  .visor .valor {
    background: #4fc3f7; border: 2px solid #b3e5fc; border-radius: 4px;
    padding: 20px 6px; text-align: center; color: #d32f2f; font-size: 34px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .visor .valor.nomeOuvinte {
    font-size: 16px; color: #003a5c; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; padding: 20px 6px;
  }

  .areaSliders { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; min-height: 0; height: 100%; }
  .sliderVertical { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
  .sliderVertical .label {
    font-size: 11px; color: #ccc; text-transform: uppercase; font-weight: 900;
  }
  .sliderVertical input[type=range] {
    writing-mode: bt-lr; -webkit-appearance: slider-vertical;
    width: 8px; height: 170px; background: transparent; cursor: pointer;
  }
  .sliderVertical input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid #fff; cursor: pointer;
  }
  #sliderMic::-webkit-slider-thumb { background: #ff2a2a; }
  #sliderMidia::-webkit-slider-thumb { background: #1fbf3f; }

  .luzes {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; height: 100%;
  }
  .luzes .linha { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; color: #000; }
  .luzes .lamp {
    width: 11px; height: 11px; border-radius: 50%;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.08s; opacity: 0.25;
  }
  .luzes .lamp.acesa {
    opacity: 1; transform: scale(1.6);
    box-shadow: 0 0 14px 4px currentColor, 0 0 24px 8px currentColor;
  }
  .luzes .barraBranca {
    width: 5px; height: 50px; background: #fff; border-radius: 3px;
    margin: 3px 0; opacity: 0.3;
  }
  .luzes .barraBranca.ativa { opacity: 1; box-shadow: 0 0 10px 3px #fff; }

  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal.ativo { display: flex; }

  .modalNotas .conteudo {
    background: #fff; color: #000; width: 500px; max-width: 92%;
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .modalNotas textarea {
    width: 100%; min-height: 260px; resize: vertical; padding: 10px; font-size: 15px;
    border: 2px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif;
  }
  .modalNotas .fechar {
    align-self: flex-end; background: #ff2a2a; color: #fff;
    border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer;
  }

  .modalChat .conteudo {
    background: #d9d9d9; color: #000; width: 620px; max-width: 95%;
    height: 520px; max-height: 92vh; border-radius: 12px; padding: 0;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .modalChat .cabecalho {
    background: #4a4a4a; color: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 10px 16px; font-size: 22px; font-weight: 900;
  }
  .modalChat .cabecalho .fechar {
    background: #ff2a2a; color: #fff; border: none; width: 34px; height: 34px;
    border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer;
  }
  .modalChat .colunas {
    display: grid; grid-template-columns: 1fr 2fr; flex: 1; overflow: hidden;
  }
  .modalChat .colUsuarios {
    background: #fff; border-right: 2px solid #bbb; padding: 10px;
    overflow-y: auto; font-size: 14px;
  }
  .modalChat .colUsuarios .user {
    padding: 6px 8px; border-bottom: 1px solid #eee; font-weight: bold;
  }
  .modalChat .colMensagens {
    background: #fff; padding: 10px; overflow-y: auto; font-size: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .modalChat .msg { word-wrap: break-word; }
  .modalChat .msg.ouvinte { color: #333; }
  .modalChat .msg.eu { color: #ff2a2a; font-weight: bold; text-align: right; }
  .modalChat .rodape {
    display: flex; gap: 8px; padding: 10px; background: #d9d9d9; border-top: 2px solid #bbb;
  }
  .modalChat .rodape input {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: none; font-size: 15px; outline: none;
  }
  .modalChat .rodape button {
    background: #4a4a4a; color: #fff; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-weight: bold; cursor: pointer;
  }

  .modalVinheta .conteudo {
    background: #fff; color: #000; padding: 20px; border-radius: 12px;
    width: 420px; max-width: 92%; text-align: center;
  }
  .modalVinheta h3 { margin-bottom: 14px; }
  .modalVinheta .opcoes { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .modalVinheta .opcoes .bolinha { width: 60px; height: 60px; font-size: 20px; }
  .modalVinheta .fechar {
    background: #ff2a2a; color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-weight: bold; cursor: pointer;
  }

  .modalSair .conteudo {
    background: #fff; color: #000; padding: 24px 28px; border-radius: 14px;
    width: 400px; max-width: 92%; text-align: center; display: flex;
    flex-direction: column; gap: 18px;
  }
  .modalSair .conteudo h3 { font-size: 22px; font-weight: 900; }
  .modalSair .botoes { display: flex; justify-content: center; gap: 12px; }
  .modalSair .btnSim {
    background: #ff2a2a; color: #fff; font-size: 16px; font-weight: 900;
    padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer;
  }
  .modalSair .btnNao {
    background: #4a4a4a; color: #fff; font-size: 16px; font-weight: 900;
    padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer;
  }

  .statusConexao {
    position: fixed; top: 8px; right: 8px; z-index: 9999;
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
    background: #666; color: #fff;
  }
  .statusConexao.on { background: #1fbf3f; }
  .statusConexao.off { background: #ff2a2a; }
</style>
</head>
<body>

<div class="statusConexao off" id="statusConexao">● desconectado</div>

<section id="telaLogin">
  <h1>LOGGIN</h1>
  <input type="text" id="inputUsuarioLogin" class="campo" placeholder="CREI SEU USUÁRIO" maxlength="20">
  <button id="btnCriarLogin">CRIAR</button>
</section>

<section id="telaPainel">
  <div class="topo">
    <div class="esquerda">
      <button class="iconeBtn" id="btnSairConta" title="Sair">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 17L21 12L16 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12H9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="nomeUsuario" id="nomeUsuarioTopo">radio web</div>
    <div class="direita">
      <button class="iconeBtn" id="btnBlocoNotas" title="Notas">📝</button>
      <button class="iconeBtn" id="btnAbrirChat" title="Chat">💬
        <span class="badge" id="badgeMensagens">0</span>
      </button>
    </div>
  </div>

  <div class="corpo">
    <div class="bloco">
      <div class="cabecalho">
        <div class="linhaVinhetas">
          <button class="btnQuadrado" id="btnAddVinheta" title="Adicionar vinheta">+</button>
          <div class="bolinha amarela" data-vinheta="1">1</div>
          <div class="bolinha verde" data-vinheta="2">2</div>
          <div class="bolinha vermelha" data-vinheta="3">3</div>
        </div>
        <div class="linhaAoVivo">
          <button class="btnAoVivo" id="btnAoVivo">AO VIVO</button>
        </div>
      </div>
      <div class="quadroCinza" id="playlistAoVivo">
        <button class="btnAddDentro" id="btnAddMusicaAoVivo" title="Adicionar ao vivo">+</button>
        <div class="tituloDentroQuadro">AO VIVO</div>
      </div>
    </div>

    <div class="bloco">
      <div class="cabecalho">
        <div class="visor">
          <div class="linhaTop">
            <span>cliques</span><span>ouvindo</span><span>online</span>
          </div>
          <div class="linhaValores">
            <div class="valor" id="visorCliques">00</div>
            <div class="valor nomeOuvinte" id="visorOuvindo">—</div>
            <div class="valor" id="visorTotal">00</div>
          </div>
        </div>
      </div>
      <div class="areaSliders">
        <div class="sliderVertical">
          <span class="label">MIC</span>
          <input type="range" id="sliderMic" min="0" max="100" value="70">
        </div>
        <div class="quadroCinza luzes" id="painelLuzes">
          <div class="linha"><span class="lamp" data-luz="0" style="background:#ff2a2a; color:#ff2a2a"></span> 0</div>
          <div class="linha"><span class="lamp" data-luz="1" style="background:#ffd400; color:#ffd400"></span> 1</div>
          <div class="linha"><span class="lamp" data-luz="2" style="background:#1fbf3f; color:#1fbf3f"></span> 2</div>
          <div class="linha"><span class="lamp" data-luz="3" style="background:#ffd400; color:#ffd400"></span> 3</div>
          <div class="linha"><span class="lamp" data-luz="4" style="background:#ff2a2a; color:#ff2a2a"></span> 4</div>
          <div class="linha"><span class="lamp" data-luz="5" style="background:#4a90e2; color:#4a90e2"></span> 5</div>
          <div class="linha"><span class="lamp" data-luz="6" style="background:#1fbf3f; color:#1fbf3f"></span> 6</div>
          <div class="linha"><span class="lamp" data-luz="7" style="background:#ffd400; color:#ffd400"></span> 7</div>
          <div class="linha"><span class="lamp" data-luz="8" style="background:#ff2a2a; color:#ff2a2a"></span> 8</div>
          <div class="linha"><span class="lamp" data-luz="9" style="background:#4a90e2; color:#4a90e2"></span> 9</div>
          <div class="barraBranca" id="barraBranca"></div>
        </div>
        <div class="sliderVertical">
          <span class="label">MÍDIA</span>
          <input type="range" id="sliderMidia" min="0" max="100" value="70">
        </div>
      </div>
    </div>

    <div class="bloco">
      <div class="cabecalho">
        <button class="btnReproduzir" id="btnReproduzirTodas">🔁 Reproduzir todas</button>
      </div>
      <div class="quadroCinza" id="playlistAutoDj">
        <button class="btnAddDentro" id="btnAddMusicaAutoDj" title="Adicionar mídia">+</button>
        <div class="tituloDentroQuadro">Auto DJ</div>
      </div>
    </div>
  </div>
</section>

<div class="modal modalNotas" id="modalNotas">
  <div class="conteudo">
    <textarea id="textoNotas" placeholder="Digite aqui suas anotações..."></textarea>
    <button class="fechar" id="fecharNotas">Fechar ✕</button>
  </div>
</div>

<div class="modal modalChat" id="modalChat">
  <div class="conteudo">
    <div class="cabecalho">
      <span>chat</span>
      <button class="fechar" id="fecharChat">✕</button>
    </div>
    <div class="colunas">
      <div class="colUsuarios" id="chatUsuarios">
        <div class="user">você (locutor)</div>
      </div>
      <div class="colMensagens" id="chatMensagens"></div>
    </div>
    <div class="rodape">
      <input type="text" id="inputChat" placeholder="digita sua mensagem">
      <button id="btnEnviarChat">ok</button>
    </div>
  </div>
</div>

<div class="modal modalVinheta" id="modalVinheta">
  <div class="conteudo">
    <h3>Escolha o botão da vinheta</h3>
    <div class="opcoes">
      <div class="bolinha amarela" data-escolha="1">1</div>
      <div class="bolinha verde" data-escolha="2">2</div>
      <div class="bolinha vermelha" data-escolha="3">3</div>
    </div>
    <button class="fechar" id="fecharVinheta">Cancelar</button>
  </div>
</div>

<div class="modal modalSair" id="modalSair">
  <div class="conteudo">
    <h3>Sair da conta?</h3>
    <p>Você tem certeza que deseja sair?<br>Você voltará para a tela de login.</p>
    <div class="botoes">
      <button class="btnNao" id="btnCancelarSair">Não</button>
      <button class="btnSim" id="btnConfirmarSair">Sim, sair</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const API_WS = 'wss://radio-web-api.onrender.com/ws/stream';
const STREAM_TOKEN = 'radio-anderson-2026-x7k9p2m4n8q1';

/* ==========================================================
   ESTADO
   ========================================================== */
const estado = {
  usuario: '',
  aoVivo: false,
  reproduzirTodas: false,
  ouvintes: [],
  conectado: false,
  musicaTocando: false,
};

let ws = null;

/* ==========================================================
   ÁUDIO
   ========================================================== */
let audioCtx = null;
let mixerNode = null;
let limiterNode = null;
let micSource = null;
let playerSource = null;
let processorNode = null;
let micGain = null;
let mediaGain = null;
let monitorGain = null;
let micStream = null;

/* ==========================================================
   PLAYER + ANALISADOR
   ========================================================== */
const player = new Audio();
player.crossOrigin = 'anonymous';
let itemTocandoAgora = null;
const filaAutoDj = [];

let analyser = null;
let dataArray = null;
const HISTORICO = 40;
let historicoEnergia = [];
let ultimaBatida = 0;
const INTERVALO_MIN_MS = 180;
const MARGEM = 15;
const ENERGIA_MIN = 25;
let ledAtual = -1;

/* ==========================================================
   WEBSOCKET
   ========================================================== */
function conectarWS() {
  const url = `${API_WS}?role=broadcaster&token=${encodeURIComponent(STREAM_TOKEN)}`;
  ws = new WebSocket(url);

  ws.addEventListener('open', () => {
    estado.conectado = true;
    atualizarStatusConexao(true);
    console.log('✅ Conectado');
    // Envia lista de usuários/status inicial
    enviarStatus();
  });

  ws.addEventListener('message', (event) => {
    if (typeof event.data !== 'string') return;
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'ready') console.log('🎙️ Pronto');
      if (msg.type === 'meta') {
        // Atualiza contador de ouvintes
        if (msg.listeners !== undefined) {
          estado.ouvintes = msg.listeners > 0 ? estado.ouvintes : [];
          document.getElementById('visorTotal').textContent = String(msg.listeners).padStart(2,'0');
        }
      }
      if (msg.type === 'chat') {
        receberChat(msg);
        if (msg.role === 'listener') {
          adicionarUsuarioChat(msg.user);
        }
      }
      if (msg.type === 'usuarios') {
        atualizarListaUsuarios(msg.lista);
      }
      if (msg.type === 'error') alert('Erro: ' + msg.message);
    } catch (e) { console.warn('Msg inválida:', e); }
  });

  ws.addEventListener('close', () => {
    estado.conectado = false;
    atualizarStatusConexao(false);
    setTimeout(conectarWS, 3000);
  });

  ws.addEventListener('error', (err) => console.warn('WS erro:', err.message));
}

function enviarStatus() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'status',
    user: estado.usuario,
  }));
}

function atualizarStatusConexao(online) {
  const el = document.getElementById('statusConexao');
  el.textContent = online ? '● conectado' : '● desconectado';
  el.className = 'statusConexao ' + (online ? 'on' : 'off');
}
