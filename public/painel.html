<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel FM — Transmitir Rádio Web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

  #telaLogin {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: #000; gap: 40px;
  }
  #telaLogin h1 { font-size: 90px; font-weight: 900; letter-spacing: 4px; color: #fff; }
  #telaLogin .campo {
    width: 420px; padding: 18px 24px; border-radius: 40px; border: none;
    background: #fff; color: #333; font-size: 18px; font-weight: bold;
    text-align: center; text-transform: uppercase; letter-spacing: 2px; outline: none;
  }
  #telaLogin .campo::placeholder { color: #999; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
  #telaLogin button {
    background: #1fbf3f; border: none; color: #000; font-size: 26px; font-weight: 900;
    padding: 14px 50px; border-radius: 40px; cursor: pointer; letter-spacing: 4px;
    text-transform: uppercase; display: flex; align-items: center; gap: 12px;
  }
  #telaLogin button::after { content: "➜"; font-size: 30px; color: #fff; }

  #telaPainel { display: none; height: 100vh; padding: 10px; background: #000; flex-direction: column; gap: 8px; overflow: hidden; }
  #telaPainel.ativo { display: flex; }

  .topo {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    background: #4a4a4a; border-radius: 12px; padding: 8px 20px; min-height: 76px; gap: 16px; flex-shrink: 0;
  }
  .topo .nomeUsuario {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: 900; color: #fff; white-space: nowrap;
  }
  .topo .esquerda, .topo .direita { display: flex; align-items: center; gap: 12px; }
  .topo .iconeBtn {
    background: transparent; border: none; cursor: pointer; font-size: 30px; color: #fff;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .topo .iconeBtn svg { width: 34px; height: 34px; display: block; }
  .topo .badge {
    position: absolute; top: -4px; right: -8px; background: #1fbf3f; color: #fff;
    font-size: 12px; font-weight: bold; border-radius: 50%;
    min-width: 20px; height: 20px;
    display: none; align-items: center; justify-content: center; padding: 0 4px;
    border: 2px solid #4a4a4a;
  }

  .corpo { display: grid; grid-template-columns: 1fr 380px 1fr; gap: 8px; flex: 1; min-height: 0; }
  .bloco {
    background: #000; border-radius: 12px; padding: 10px;
    display: grid; grid-template-rows: 230px 1fr; gap: 8px; min-height: 0;
  }
  .bloco .cabecalho { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

  .quadroCinza {
    background: #d9d9d9; border-radius: 10px; padding: 8px; overflow-y: auto;
    min-height: 0; height: 100%; position: relative;
  }
  .quadroCinza .btnAddDentro {
    position: absolute; top: 8px; right: 8px; background: #2c2c2c; border: 2px solid #555;
    border-radius: 8px; color: #fff; font-size: 22px; font-weight: bold;
    width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; z-index: 3;
  }
  .tituloDentroQuadro {
    text-align: center; font-size: 30px; font-weight: 900; color: #000;
    padding: 6px 0 10px 0; border-bottom: 2px solid #bbb; margin-bottom: 8px;
  }
  .quadroCinza .item {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
    color: #000; font-size: 12px; font-weight: bold; padding-right: 60px;
  }
  .quadroCinza .item.tocando { background: #b8e6b8; }
  .quadroCinza .item .info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .quadroCinza .item .info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .quadroCinza .item .play {
    width: 26px; height: 26px; background: #000; color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 12px; flex-shrink: 0;
  }
  .quadroCinza .item .apagar {
    color: #ff2a2a; cursor: pointer; font-size: 10px; background: #ffdada;
    padding: 2px 8px; border-radius: 10px;
  }
  .quadroCinza .item .duracao { color: #888; font-size: 10px; margin-left: 6px; }

  .btnQuadrado {
    width: 40px; height: 40px; background: #2c2c2c; border: 2px solid #555; border-radius: 8px;
    color: #fff; font-size: 22px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .linhaVinhetas { display: flex; align-items: center; gap: 8px; }

  .bolinha {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #000; font-size: 16px; border: 3px solid #fff;
    cursor: pointer; flex-shrink: 0;
  }
  .bolinha.amarela { background: #ffd400; }
  .bolinha.verde { background: #1fbf3f; }
  .bolinha.vermelha { background: #ff2a2a; }

  .linhaAoVivo { display: flex; justify-content: center; width: 100%; margin-top: auto; margin-bottom: 4px; }
  .btnAoVivo {
    background: #fff; color: #1a4ed8; font-size: 16px; font-weight: 900;
    padding: 6px 18px; border-radius: 14px; border: 3px solid #1a4ed8;
    cursor: pointer; letter-spacing: 1.5px;
  }
  .btnAoVivo.ligado { background: #1fbf3f; color: #fff; border-color: #1fbf3f; }

  .btnReproduzir {
    background: #fff; color: #1a4ed8; font-size: 11px; font-weight: 900;
    padding: 5px 10px; border-radius: 14px; border: 3px solid #1a4ed8;
    cursor: pointer; width: 130px; text-align: center;
    margin-top: auto; margin-bottom: 4px; align-self: center;
  }
  .btnReproduzir.ligado { background: #1fbf3f; color: #fff; border-color: #1fbf3f; }

  .visor {
    border-radius: 8px; padding: 14px; background: #4fc3f7; border: 4px solid #a020c0;
    display: flex; flex-direction: column; gap: 10px; font-weight: bold; flex: 1;
    min-height: 0;
  }
  .visor .linhaTop {
    display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 18px;
    text-transform: lowercase; text-align: center; color: #000; font-weight: 900;
  }
  .visor .linhaValores { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
  .visor .valor {
    background: #4fc3f7; border: 2px solid #b3e5fc; border-radius: 4px;
    padding: 20px 6px; text-align: center; color: #d32f2f; font-size: 34px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .visor .valor.nomeOuvinte {
    font-size: 14px; color: #003a5c; overflow-y: auto; overflow-x: hidden;
    padding: 8px 6px; display: flex; flex-direction: column; align-items: stretch;
    gap: 4px; text-align: left; justify-content: flex-start;
    scrollbar-width: thin;
  }
  .visor .valor.nomeOuvinte::-webkit-scrollbar { width: 6px; }
  .visor .valor.nomeOuvinte::-webkit-scrollbar-thumb { background: #0288d1; border-radius: 3px; }
  .visor .valor.nomeOuvinte .ouvinteItem {
    background: rgba(255,255,255,0.5); border-radius: 4px;
    padding: 4px 8px; font-size: 13px; font-weight: 900;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #003a5c;
  }
  .visor .valor.nomeOuvinte .vazio {
    font-size: 13px; color: #003a5c; opacity: 0.6;
    text-align: center; margin-top: 12px; font-style: italic;
  }

  .areaSliders { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; min-height: 0; height: 100%; }
  .sliderVertical { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
  .sliderVertical .label { font-size: 11px; color: #ccc; text-transform: uppercase; font-weight: 900; }
  .sliderVertical input[type=range] {
    writing-mode: bt-lr; -webkit-appearance: slider-vertical;
    width: 8px; height: 170px; background: transparent; cursor: pointer;
  }
  .sliderVertical input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid #fff; cursor: pointer;
  }
  #sliderMic::-webkit-slider-thumb { background: #ff2a2a; }
  #sliderMidia::-webkit-slider-thumb { background: #1fbf3f; }

  .luzes {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; height: 100%;
  }
  .luzes .linha { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; color: #000; }
  .luzes .lamp {
    width: 11px; height: 11px; border-radius: 50%;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.08s; opacity: 0.25;
  }
  .luzes .lamp.acesa {
    opacity: 1; transform: scale(1.6);
    box-shadow: 0 0 14px 4px currentColor, 0 0 24px 8px currentColor;
  }
  .luzes .barraBranca {
    width: 5px; height: 50px; background: #fff; border-radius: 3px;
    margin: 3px 0; opacity: 0.3;
  }
  .luzes .barraBranca.ativa { opacity: 1; box-shadow: 0 0 10px 3px #fff; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
  .modal.ativo { display: flex; }

  .modalNotas .conteudo {
    background: #fff; color: #000; width: 500px; max-width: 92%;
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .modalNotas textarea {
    width: 100%; min-height: 260px; resize: vertical; padding: 10px; font-size: 15px;
    border: 2px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif;
  }
  .modalNotas .fechar { align-self: flex-end; background: #ff2a2a; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer; }

  .modalChat .conteudo {
    background: #d9d9d9; color: #000; width: 760px; max-width: 95%;
    height: 560px; max-height: 92vh; border-radius: 12px; padding: 0;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .modalChat .cabecalho {
    background: #4a4a4a; color: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 10px 16px; font-size: 22px; font-weight: 900;
  }
  .modalChat .cabecalho .fechar {
    background: #ff2a2a; color: #fff; border: none; width: 34px; height: 34px;
    border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer;
  }
  .modalChat .colunas {
    display: grid; grid-template-columns: 220px 1fr; flex: 1; overflow: hidden;
  }
  .modalChat .colUsuarios {
    background: #fff; border-right: 2px solid #bbb; overflow-y: auto; font-size: 14px;
  }
  .modalChat .colUsuarios .user {
    padding: 12px 14px; border-bottom: 1px solid #eee; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    transition: background 0.15s;
  }
  .modalChat .colUsuarios .user:hover { background: #f0f0f0; }
  .modalChat .colUsuarios .user.ativo { background: #4a4a4a; color: #fff; }
  .modalChat .colUsuarios .user .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #1fbf3f; flex-shrink: 0;
  }
  .modalChat .colUsuarios .user .nome {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-right: 8px;
  }
  .modalChat .colUsuarios .user .contador {
    background: #ff2a2a; color: #fff; font-size: 10px;
    min-width: 18px; height: 18px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px; font-weight: 900;
  }
  .modalChat .colMensagens {
    background: #ece5dd; padding: 12px; overflow-y: auto; font-size: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .modalChat .colMensagens .vazio {
    text-align: center; color: #888; font-style: italic; margin-top: 20px;
  }
  .modalChat .msg {
    max-width: 70%; padding: 8px 12px; border-radius: 10px;
    word-wrap: break-word; line-height: 1.3; position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.15);
  }
  .modalChat .msg .autor {
    font-size: 10px; font-weight: 900; display: block; margin-bottom: 2px;
    opacity: 0.75;
  }
  .modalChat .msg .hora {
    font-size: 9px; color: #666; float: right; margin-left: 8px; margin-top: 4px;
  }
  .modalChat .msg.recebida {
    background: #fff; color: #000; align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  .modalChat .msg.enviada {
    background: #dcf8c6; color: #000; align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .modalChat .msg.privada { border: 2px dashed #a020c0; }
  .modalChat .rodape {
    display: flex; gap: 8px; padding: 10px; background: #d9d9d9; border-top: 2px solid #bbb;
  }
  .modalChat .rodape input {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: none; font-size: 15px; outline: none;
  }
  .modalChat .rodape button {
    background: #4a4a4a; color: #fff; border: none; border-radius: 50%;
    width: 44px; height: 44px; font-weight: bold; cursor: pointer;
  }
  .modalChat .rodape button:disabled { opacity: 0.5; cursor: not-allowed; }

  .modalVinheta .conteudo {
    background: #fff; color: #000; padding: 20px; border-radius: 12px;
    width: 420px; max-width: 92%; text-align: center;
  }
  .modalVinheta h3 { margin-bottom: 14px; }
  .modalVinheta .opcoes { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .modalVinheta .opcoes .bolinha { width: 60px; height: 60px; font-size: 20px; }
  .modalVinheta .fechar { background: #ff2a2a; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: bold; cursor: pointer; }

  .modalSair .conteudo {
    background: #fff; color: #000; padding: 24px 28px; border-radius: 14px;
    width: 400px; max-width: 92%; text-align: center; display: flex;
    flex-direction: column; gap: 18px;
  }
  .modalSair .conteudo h3 { font-size: 22px; font-weight: 900; }
  .modalSair .botoes { display: flex; justify-content: center; gap: 12px; }
  .modalSair .btnSim { background: #ff2a2a; color: #fff; font-size: 16px; font-weight: 900; padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer; }
  .modalSair .btnNao { background: #4a4a4a; color: #fff; font-size: 16px; font-weight: 900; padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer; }

  .statusConexao {
    position: fixed; top: 8px; right: 8px; z-index: 9999;
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
    background: #666; color: #fff;
  }
  .statusConexao.on { background: #1fbf3f; }
  .statusConexao.off { background: #ff2a2a; }
</style>
</head>
<body>

<div class="statusConexao off" id="statusConexao">● desconectado</div>

<section id="telaLogin">
  <h1>LOGGIN</h1>
  <input type="text" id="inputUsuarioLogin" class="campo" placeholder="CREI SEU USUÁRIO" maxlength="20">
  <button id="btnCriarLogin">CRIAR</button>
</section>

<section id="telaPainel">
  <div class="topo">
    <div class="esquerda">
      <button class="iconeBtn" id="btnSairConta" title="Sair">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 17L21 12L16 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12H9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="nomeUsuario" id="nomeUsuarioTopo">radio web</div>
    <div class="direita">
      <button class="iconeBtn" id="btnBlocoNotas" title="Notas">📝</button>
      <button class="iconeBtn" id="btnAbrirChat" title="Chat">💬
        <span class="badge" id="badgeMensagens">0</span>
      </button>
    </div>
  </div>

  <div class="corpo">
    <div class="bloco">
      <div class="cabecalho">
        <div class="linhaVinhetas">
          <button class="btnQuadrado" id="btnAddVinheta" title="Adicionar vinheta">+</button>
          <div class="bolinha amarela" data-vinheta="1">1</div>
          <div class="bolinha verde" data-vinheta="2">2</div>
          <div class="bolinha vermelha" data-vinheta="3">3</div>
        </div>
        <div class="linhaAoVivo">
          <button class="btnAoVivo" id="btnAoVivo">AO VIVO</button>
        </div>
      </div>
      <div class="quadroCinza" id="playlistAoVivo">
        <button class="btnAddDentro" id="btnAddMusicaAoVivo" title="Adicionar ao vivo">+</button>
        <div class="tituloDentroQuadro">AO VIVO</div>
      </div>
    </div>

    <div class="bloco">
      <div class="cabecalho">
        <div class="visor">
          <div class="linhaTop">
            <span>cliques</span><span>ouvindo</span><span>online</span>
          </div>
          <div class="linhaValores">
            <div class="valor" id="visorCliques">00</div>
            <div class="valor nomeOuvinte" id="visorOuvindo">
              <div class="vazio">ninguém ouvindo</div>
            </div>
            <div class="valor" id="visorTotal">00</div>
          </div>
        </div>
      </div>
      <div class="areaSliders">
        <div class="sliderVertical">
          <span class="label">MIC</span>
          <input type="range" id="sliderMic" min="0" max="100" value="70">
        </div>
        <div class="quadroCinza luzes" id="painelLuzes">
          <div class="linha"><span class="lamp" data-luz="0" style="background:#ff2a2a; color:#ff2a2a"></span> 0</div>
          <div class="linha"><span class="lamp" data-luz="1" style="background:#ffd400; color:#ffd400"></span> 1</div>
          <div class="linha"><span class="lamp" data-luz="2" style="background:#1fbf3f; color:#1fbf3f"></span> 2</div>
          <div class="linha"><span class="lamp" data-luz="3" style="background:#ffd400; color:#ffd400"></span> 3</div>
          <div class="linha"><span class="lamp" data-luz="4" style="background:#ff2a2a; color:#ff2a2a"></span> 4</div>
          <div class="linha"><span class="lamp" data-luz="5" style="background:#4a90e2; color:#4a90e2"></span> 5</div>
          <div class="linha"><span class="lamp" data-luz="6" style="background:#1fbf3f; color:#1fbf3f"></span> 6</div>
          <div class="linha"><span class="lamp" data-luz="7" style="background:#ffd400; color:#ffd400"></span> 7</div>
          <div class="linha"><span class="lamp" data-luz="8" style="background:#ff2a2a; color:#ff2a2a"></span> 8</div>
          <div class="linha"><span class="lamp" data-luz="9" style="background:#4a90e2; color:#4a90e2"></span> 9</div>
          <div class="barraBranca" id="barraBranca"></div>
        </div>
        <div class="sliderVertical">
          <span class="label">MÍDIA</span>
          <input type="range" id="sliderMidia" min="0" max="100" value="70">
        </div>
      </div>
    </div>

    <div class="bloco">
      <div class="cabecalho">
        <button class="btnReproduzir" id="btnReproduzirTodas">🔁 Reproduzir todas</button>
      </div>
      <div class="quadroCinza" id="playlistAutoDj">
        <button class="btnAddDentro" id="btnAddMusicaAutoDj" title="Adicionar mídia">+</button>
        <div class="tituloDentroQuadro">Auto DJ</div>
      </div>
    </div>
  </div>
</section>

<div class="modal modalNotas" id="modalNotas">
  <div class="conteudo">
    <textarea id="textoNotas" placeholder="Digite aqui suas anotações..."></textarea>
    <button class="fechar" id="fecharNotas">Fechar ✕</button>
  </div>
</div>

<div class="modal modalChat" id="modalChat">
  <div class="conteudo">
    <div class="cabecalho">
      <span>chat</span>
      <button class="fechar" id="fecharChat">✕</button>
    </div>
    <div class="colunas">
      <div class="colUsuarios" id="chatUsuarios"></div>
      <div class="colMensagens" id="chatMensagens"></div>
    </div>
    <div class="rodape">
      <input type="text" id="inputChat" placeholder="digita sua mensagem">
      <button id="btnEnviarChat">ok</button>
    </div>
  </div>
</div>

<div class="modal modalVinheta" id="modalVinheta">
  <div class="conteudo">
    <h3>Escolha o botão da vinheta</h3>
    <div class="opcoes">
      <div class="bolinha amarela" data-escolha="1">1</div>
      <div class="bolinha verde" data-escolha="2">2</div>
      <div class="bolinha vermelha" data-escolha="3">3</div>
    </div>
    <button class="fechar" id="fecharVinheta">Cancelar</button>
  </div>
</div>

<div class="modal modalSair" id="modalSair">
  <div class="conteudo">
    <h3>Sair da conta?</h3>
    <p>Você tem certeza que deseja sair?<br>Você voltará para a tela de login.</p>
    <div class="botoes">
      <button class="btnNao" id="btnCancelarSair">Não</button>
      <button class="btnSim" id="btnConfirmarSair">Sim, sair</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const API_WS = 'wss://radio-web-api.onrender.com/ws/stream';
const STREAM_TOKEN = 'radio-anderson-2026-x7k9p2m4n8q1';

/* ==========================================================
   ESTADO
   ========================================================== */
const estado = {
  usuario: '',
  aoVivo: false,
  transmitindo: false,
  reproduzirTodas: false,
  ouvintes: [],
  conectado: false,
  musicaTocando: false,
  contatoAtivo: null,
};

let ws = null;
const conversas = new Map();

/* ==========================================================
   ÁUDIO — OPUS
   ========================================================== */
let audioCtx = null;
let mixerNode = null;
let limiterNode = null;
let micSource = null;
let playerSource = null;
let micGain = null;
let mediaGain = null;
let monitorGain = null;
let micStream = null;
let mediaRecorder = null;

/* ==========================================================
   PLAYER + ANALISADOR
   ========================================================== */
const player = new Audio();
player.crossOrigin = 'anonymous';
let itemTocandoAgora = null;
const filaAutoDj = [];
const filaAoVivo = [];

let analyser = null;
let dataArray = null;
const HISTORICO = 40;
let historicoEnergia = [];
let ultimaBatida = 0;
const INTERVALO_MIN_MS = 180;
const MARGEM = 15;
const ENERGIA_MIN = 25;
let ledAtual = -1;

/* ==========================================================
   WEBSOCKET
   ========================================================== */
function conectarWS() {
  const url = `${API_WS}?role=broadcaster&token=${encodeURIComponent(STREAM_TOKEN)}`;
  ws = new WebSocket(url);

  ws.addEventListener('open', () => {
    estado.conectado = true;
    atualizarStatusConexao(true);
    console.log('✅ Conectado');
    enviarStatus();
  });

  ws.addEventListener('message', (event) => {
    if (typeof event.data !== 'string') return;
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'ready') console.log('🎙️ Pronto');
      if (msg.type === 'meta' && msg.listeners !== undefined) atualizarVisorContagem(msg.listeners);
      if (msg.type === 'ouvintes') atualizarListaOuvintes(msg.nomes, msg.total);
      if (msg.type === 'chat') registrarMensagem(msg);
      if (msg.type === 'historico') msg.mensagens.forEach(m => registrarMensagem(m, true));
      if (msg.type === 'error') {
        console.warn('Erro do servidor:', msg.message);
        if (msg.message === 'Já existe transmissão ativa') atualizarStatusConexao(false);
      }
    } catch (e) { console.warn('Msg inválida:', e); }
  });

  ws.addEventListener('close', () => {
    estado.conectado = false;
    atualizarStatusConexao(false);
    setTimeout(conectarWS, 3000);
  });

  ws.addEventListener('error', (err) => console.warn('WS erro:', err.message));
}

function enviarStatus() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'status', user: estado.usuario }));
}

function atualizarStatusConexao(online) {
  const el = document.getElementById('statusConexao');
  el.textContent = online ? '● conectado' : '● desconectado';
  el.className = 'statusConexao ' + (online ? 'on' : 'off');
}

/* ==========================================================
   ÁUDIO — inicialização (mantém mixer pra LEDs e monitor)
   ========================================================== */
async function inicializarAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({
    sampleRate: 48000, latencyHint: 'interactive',
  });
  await audioCtx.resume();

  mixerNode = audioCtx.createGain();
  mixerNode.gain.value = 0.9;

  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -18;
  compressor.knee.value = 12;
  compressor.ratio.value = 4;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  mixerNode.connect(compressor);

  const lowpass = audioCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 15000;
  lowpass.Q.value = 0.7;
  compressor.connect(lowpass);

  limiterNode = audioCtx.createDynamicsCompressor();
  limiterNode.threshold.value = -3;
  limiterNode.knee.value = 0;
  limiterNode.ratio.value = 20;
  limiterNode.attack.value = 0.001;
  limiterNode.release.value = 0.1;
  lowpass.connect(limiterNode);

  micGain = audioCtx.createGain();
  micGain.gain.value = document.getElementById('sliderMic').value / 100;

  mediaGain = audioCtx.createGain();
  mediaGain.gain.value = document.getElementById('sliderMidia').value / 100;

  playerSource = audioCtx.createMediaElementSource(player);
  playerSource.connect(mediaGain);
  mediaGain.connect(mixerNode);

  monitorGain = audioCtx.createGain();
  monitorGain.gain.value = 0.8;
  mediaGain.connect(monitorGain);
  monitorGain.connect(audioCtx.destination);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.6;
  limiterNode.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  loopAnalise();
  console.log('🎧 Áudio inicializado (mixer pronto)');
}

function nomeMusicaAtual() {
  return itemTocandoAgora ? itemTocandoAgora.querySelector('.info span').textContent : 'Radio Web';
}

/* ==========================================================
   OPUS — MediaRecorder no mixer
   ========================================================== */
function iniciarTransmissaoOpus() {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  if (!mixerNode || !audioCtx) return;

  // Cria um destino MediaStream a partir do mixerNode
  const destino = audioCtx.createMediaStreamDestination();
  limiterNode.connect(destino);

  // Codec Opus a 48kbps, mono (voz) — sem perda perceptível
  const mimeOpus = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : 'audio/ogg;codecs=opus';

  mediaRecorder = new MediaRecorder(destino.stream, {
    mimeType: mimeOpus,
    audioBitsPerSecond: 64000,   // 64 kbps: ótimo pra voz + música
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(e.data);
    }
  };

  // Envia um chunk a cada 100ms (latência aceitável e boa estabilidade)
  mediaRecorder.start(100);
  console.log('🎙️ Transmissão Opus iniciada');
}

function pararTransmissaoOpus() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder = null;
    console.log('🎙️ Transmissão Opus parada');
  }
}

/* ==========================================================
   MICROFONE
   ========================================================== */
async function ligarMicrofone() {
  if (micSource) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        sampleRate: 48000, channelCount: 1,
      }
    });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micSource.connect(micGain);
    micGain.connect(mixerNode);
    console.log('🎤 Mic ligado');
  } catch (err) {
    alert('Erro ao acessar microfone: ' + err.message);
    throw err;
  }
}

function desligarMicrofone() {
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

/* ==========================================================
   AO VIVO
   ========================================================== */
const btnAoVivo = document.getElementById('btnAoVivo');
btnAoVivo.addEventListener('click', async () => {
  if (!audioCtx) await inicializarAudio();
  if (!estado.aoVivo) {
    try {
      await ligarMicrofone();
      estado.aoVivo = true;
      btnAoVivo.classList.add('ligado');
      btnAoVivo.textContent = 'NO AR';
      iniciarTransmissaoOpus();
      enviarMeta(nomeMusicaAtual());
    } catch (err) { console.warn(err.message); }
  } else {
    estado.aoVivo = false;
    desligarMicrofone();
    btnAoVivo.classList.remove('ligado');
    btnAoVivo.textContent = 'AO VIVO';
    // Se não estiver tocando música, para a transmissão
    if (!estado.musicaTocando) pararTransmissaoOpus();
  }
});

/* ==========================================================
   LEDs
   ========================================================== */
const leds = document.querySelectorAll('#painelLuzes .lamp');
const barraBranca = document.getElementById('barraBranca');

function acenderProximaLed() {
  leds.forEach(l => l.classList.remove('acesa'));
  ledAtual++;
  if (ledAtual >= leds.length) ledAtual = 0;
  if (leds[ledAtual]) {
    leds[ledAtual].classList.add('acesa');
    barraBranca.classList.add('ativa');
    setTimeout(() => barraBranca.classList.remove('ativa'), 60);
  }
}

function loopAnalise() {
  requestAnimationFrame(loopAnalise);
  if (!analyser || !dataArray) return;
  analyser.getByteFrequencyData(dataArray);
  const energia = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
  historicoEnergia.push(energia);
  if (historicoEnergia.length > HISTORICO) historicoEnergia.shift();
  const media = historicoEnergia.reduce((a, b) => a + b, 0) / historicoEnergia.length;
  const agora = performance.now();
  const ehBatida = (energia > media + MARGEM) && (energia > ENERGIA_MIN);
  if (ehBatida && (agora - ultimaBatida) > INTERVALO_MIN_MS) {
    ultimaBatida = agora;
    acenderProximaLed();
  }
}

/* ==========================================================
   PLAYER — AutoDJ
   ========================================================== */
function tocarItemDaFila(index) {
  if (index < 0 || index >= filaAutoDj.length) return;
  if (itemTocandoAgora) itemTocandoAgora.classList.remove('tocando');
  const entrada = filaAutoDj[index];
  player.src = entrada.url;
  player.play().then(() => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }).catch(err => console.warn('Erro ao tocar:', err.message));
  entrada.item.classList.add('tocando');
  itemTocandoAgora = entrada.item;
  itemTocandoAgora._indice = index;
  itemTocandoAgora._origem = 'autodj';
  estado.musicaTocando = true;
  iniciarTransmissaoOpus();       // 🔴 começa a transmitir
  enviarMeta(entrada.arquivo.name);
}

function proximaMusica() {
  if (filaAutoDj.length === 0) return;
  const atual = itemTocandoAgora && itemTocandoAgora._origem === 'autodj' ? itemTocandoAgora._indice : -1;
  let proximo = atual + 1;
  if (proximo >= filaAutoDj.length) {
    if (estado.reproduzirTodas) proximo = 0;
    else {
      if (itemTocandoAgora) itemTocandoAgora.classList.remove('tocando');
      itemTocandoAgora = null;
      estado.musicaTocando = false;
      if (!estado.aoVivo) pararTransmissaoOpus();
      return;
    }
  }
  tocarItemDaFila(proximo);
}

/* ==========================================================
   PLAYER — Playlist AO VIVO
   ========================================================== */
function tocarItemAoVivo(index) {
  if (index < 0 || index >= filaAoVivo.length) return;
  if (itemTocandoAgora) itemTocandoAgora.classList.remove('tocando');
  const entrada = filaAoVivo[index];
  player.src = entrada.url;
  player.play().then(() => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }).catch(err => console.warn('Erro ao tocar:', err.message));
  entrada.item.classList.add('tocando');
  itemTocandoAgora = entrada.item;
  itemTocandoAgora._indice = index;
  itemTocandoAgora._origem = 'aovivo';
  estado.musicaTocando = true;
  iniciarTransmissaoOpus();       // 🔴 começa a transmitir
  enviarMeta(entrada.arquivo.name);
}

function proximaMusicaAoVivo() {
  if (filaAoVivo.length === 0) return;
  const atual = itemTocandoAgora && itemTocandoAgora._origem === 'aovivo' ? itemTocandoAgora._indice : -1;
  let proximo = atual + 1;
  if (proximo >= filaAoVivo.length) proximo = 0;
  tocarItemAoVivo(proximo);
}

player.addEventListener('ended', () => {
  if (!itemTocandoAgora) return;
  const origem = itemTocandoAgora._origem;
  if (origem === 'autodj') proximaMusica();
  else if (origem === 'aovivo') proximaMusicaAoVivo();
  else {
    itemTocandoAgora.classList.remove('tocando');
    itemTocandoAgora = null;
    estado.musicaTocando = false;
    if (!estado.aoVivo) pararTransmissaoOpus();
  }
});

function enviarMeta(titulo) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'meta', title: titulo, live: true }));
  }
}

/* ==========================================================
   LOGIN
   ========================================================== */
const telaLogin = document.getElementById('telaLogin');
const telaPainel = document.getElementById('telaPainel');
const inputLogin = document.getElementById('inputUsuarioLogin');
const btnCriar = document.getElementById('btnCriarLogin');

const usuarioSalvo = localStorage.getItem('painelUsuario');
if (usuarioSalvo) entrarNoPainel(usuarioSalvo);

btnCriar.addEventListener('click', () => {
  const nome = inputLogin.value.trim();
  if (!nome) { alert('Digite um nome!'); return; }
  localStorage.setItem('painelUsuario', nome);
  entrarNoPainel(nome);
});

inputLogin.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btnCriar.click();
});

async function entrarNoPainel(nome) {
  estado.usuario = nome;
  telaLogin.style.display = 'none';
  telaPainel.classList.add('ativo');
  document.getElementById('nomeUsuarioTopo').textContent = nome.toLowerCase();
  conectarWS();
  await inicializarAudio();
  renderizarListaContatos();
}

/* ==========================================================
   TOPO
   ========================================================== */
const modalNotas = document.getElementById('modalNotas');
const modalChat = document.getElementById('modalChat');
const modalVinheta = document.getElementById('modalVinheta');
const modalSair = document.getElementById('modalSair');

document.getElementById('btnBlocoNotas').addEventListener('click', () => {
  modalNotas.classList.add('ativo');
  document.getElementById('textoNotas').focus();
});
document.getElementById('fecharNotas').addEventListener('click', () => {
  modalNotas.classList.remove('ativo');
});
document.getElementById('btnAbrirChat').addEventListener('click', () => {
  modalChat.classList.add('ativo');
  document.getElementById('badgeMensagens').style.display = 'none';
  document.getElementById('badgeMensagens').textContent = '0';
});
document.getElementById('fecharChat').addEventListener('click', () => {

});

/* ==========================================================
   SAIR
   ========================================================== */
document.getElementById('btnSairConta').addEventListener('click', () => {
  modalSair.classList.add('ativo');
});
document.getElementById('btnCancelarSair').addEventListener('click', () => {
  modalSair.classList.remove('ativo');
});
document.getElementById('btnConfirmarSair').addEventListener('click', () => {
  if (estado.aoVivo) {
    estado.aoVivo = false;
    desligarMicrofone();
    btnAoVivo.classList.remove('ligado');
    btnAoVivo.textContent = 'AO VIVO';
  }
  pararTransmissaoOpus();
  if (!player.paused) player.pause();
  if (ws) { ws.close(); ws = null; }
  localStorage.removeItem('painelUsuario');
  modalSair.classList.remove('ativo');
  telaPainel.classList.remove('ativo');
  telaLogin.style.display = 'flex';
  inputLogin.value = '';
  inputLogin.focus();
});

/* ==========================================================
   VINHETAS
   ========================================================== */
document.getElementById('btnAddVinheta').addEventListener('click', () => {
  modalVinheta.classList.add('ativo');
});
document.getElementById('fecharVinheta').addEventListener('click', () => {
  modalVinheta.classList.remove('ativo');
});
document.querySelectorAll('.modalVinheta .bolinha').forEach(b => {
  b.addEventListener('click', () => {
    const escolha = b.dataset.escolha;
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*';
    input.onchange = (e) => {
      const arquivo = e.target.files[0];
      if (arquivo) {
        const bolinha = document.querySelector(`.bolinha[data-vinheta="${escolha}"]`);
        bolinha._arquivo = arquivo;
        bolinha.style.boxShadow = '0 0 10px #fff';
      }
    };
    input.click();
    modalVinheta.classList.remove('ativo');
  });
});
document.querySelectorAll('.bolinha[data-vinheta]').forEach(b => {
  b.addEventListener('click', () => {
    if (b._arquivo) {
      const url = URL.createObjectURL(b._arquivo);
      const tmp = new Audio(url);
      tmp.play().catch(err => console.warn(err));
    }
  });
});

/* ==========================================================
   PLAYLISTS
   ========================================================== */
function criarItemPlaylist(arquivo, tipo) {
  const item = document.createElement('div');
  item.className = 'item';
  const url = URL.createObjectURL(arquivo);
  item._url = url;
  item.innerHTML = `
    <div class="info">
      <div class="play">▶</div>
      <span>${arquivo.name}</span>
    </div>
    <div>
      <span class="duracao">--:--</span>
      <span class="apagar">apagar</span>
    </div>
  `;
  item.querySelector('.play').addEventListener('click', async () => {
    if (!audioCtx) await inicializarAudio();
    if (tipo === 'autoDj') {
      const idx = filaAutoDj.findIndex(e => e.item === item);
      if (idx !== -1) {
        if (itemTocandoAgora === item && !player.paused) {
          player.pause();
          item.classList.remove('tocando');
          itemTocandoAgora = null;
          estado.musicaTocando = false;
          if (!estado.aoVivo) pararTransmissaoOpus();
        } else {
          tocarItemDaFila(idx);
        }
      }
    } else {
      const idx = filaAoVivo.findIndex(e => e.item === item);
      if (idx !== -1) {
        if (itemTocandoAgora === item && !player.paused) {
          player.pause();
          item.classList.remove('tocando');
          itemTocandoAgora = null;
          estado.musicaTocando = false;
          if (!estado.aoVivo) pararTransmissaoOpus();
        } else {
          tocarItemAoVivo(idx);
        }
      }
    }
  });
  item.querySelector('.apagar').addEventListener('click', () => {
    if (itemTocandoAgora === item) {
      player.pause();
      itemTocandoAgora = null;
      estado.musicaTocando = false;
      if (!estado.aoVivo) pararTransmissaoOpus();
    }
    URL.revokeObjectURL(url);
    if (tipo === 'autoDj') {
      const idx = filaAutoDj.findIndex(e => e.item === item);
      if (idx !== -1) filaAutoDj.splice(idx, 1);
    } else {
      const idx = filaAoVivo.findIndex(e => e.item === item);
      if (idx !== -1) filaAoVivo.splice(idx, 1);
    }
    item.remove();
  });
  const audioTemp = new Audio(url);
  audioTemp.addEventListener('loadedmetadata', () => {
    const min = Math.floor(audioTemp.duration / 60);
    const seg = Math.floor(audioTemp.duration % 60).toString().padStart(2, '0');
    item.querySelector('.duracao').textContent = `${min}:${seg}`;
  });
  return item;
}

document.getElementById('btnAddMusicaAoVivo').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*';
  input.multiple = true;
  input.onchange = (e) => {
    Array.from(e.target.files).forEach(arquivo => {
      const item = criarItemPlaylist(arquivo, 'aoVivo');
      document.getElementById('playlistAoVivo').appendChild(item);
      filaAoVivo.push({ url: item._url, item, arquivo });
    });
  };
  input.click();
});

document.getElementById('btnAddMusicaAutoDj').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*';
  input.multiple = true;
  input.onchange = (e) => {
    Array.from(e.target.files).forEach(arquivo => {
      const item = criarItemPlaylist(arquivo, 'autoDj');
      document.getElementById('playlistAutoDj').appendChild(item);
      filaAutoDj.push({ url: item._url, item, arquivo });
    });
  };
  input.click();
});

const btnReproduzirTodas = document.getElementById('btnReproduzirTodas');
btnReproduzirTodas.addEventListener('click', async () => {
  if (!audioCtx) await inicializarAudio();
  estado.reproduzirTodas = !estado.reproduzirTodas;
  btnReproduzirTodas.classList.toggle('ligado', estado.reproduzirTodas);
  if (estado.reproduzirTodas && !itemTocandoAgora && filaAutoDj.length > 0) {
    tocarItemDaFila(0);
  }
});

/* ==========================================================
   SLIDERS
   ========================================================== */
document.getElementById('sliderMic').addEventListener('input', (e) => {
  if (micGain) micGain.gain.value = e.target.value / 100;
});
document.getElementById('sliderMidia').addEventListener('input', (e) => {
  if (mediaGain) mediaGain.gain.value = e.target.value / 100;
  player.volume = e.target.value / 100;
});

/* ==========================================================
   VISOR
   ========================================================== */
function atualizarVisorContagem(listeners) {
  const n = (listeners !== undefined && listeners !== null) ? listeners : 0;
  document.getElementById('visorCliques').textContent = String(n).padStart(2,'0');
  document.getElementById('visorTotal').textContent = String(n).padStart(2,'0');
}

function atualizarListaOuvintes(nomes, total) {
  const container = document.getElementById('visorOuvindo');
  container.innerHTML = '';
  const nomesValidos = (nomes || []).filter(n =>
    n && n.trim() !== '' &&
    n.toLowerCase() !== 'anônimo' &&
    n.toLowerCase() !== 'anonimo' &&
    n.toLowerCase() !== 'anônima' &&
    n.toLowerCase() !== 'anonima'
  );
  if (nomesValidos.length === 0) {
    const vazio = document.createElement('div');
    vazio.className = 'vazio';
    vazio.textContent = 'ninguém ouvindo';
    container.appendChild(vazio);
  } else {
    nomesValidos.forEach(nome => {
      const item = document.createElement('div');
      item.className = 'ouvinteItem';
      item.textContent = nome;
      container.appendChild(item);
    });
  }
  atualizarVisorContagem(nomesValidos.length);
}

/* ==========================================================
   CHAT ESTILO WHATSAPP
   ========================================================== */
const usuariosChat = new Set();
const naoLidas = new Map();

function registrarMensagem(msg, silencioso = false) {
  const contato = msg.role === 'listener' ? msg.user : (msg.target || 'locutor');
  if (!conversas.has(contato)) conversas.set(contato, []);
  conversas.get(contato).push(msg);
  if (msg.role === 'listener' && msg.user) usuariosChat.add(msg.user);
  if (!silencioso && msg.role === 'listener') {
    const chatAberto = modalChat.classList.contains('ativo');
    const ehContatoAtivo = estado.contatoAtivo === contato;
    if (!chatAberto || !ehContatoAtivo) {
      naoLidas.set(contato, (naoLidas.get(contato) || 0) + 1);
      const badge = document.getElementById('badgeMensagens');
      const atual = parseInt(badge.textContent) || 0;
      badge.textContent = atual + 1;
      badge.style.display = 'flex';
    }
  }
  renderizarListaContatos();
  if (estado.contatoAtivo === contato) renderizarMensagens();
}

function renderizarListaContatos() {
  const container = document.getElementById('chatUsuarios');
  container.innerHTML = '';
  const todos = document.createElement('div');
  todos.className = 'user' + (estado.contatoAtivo === '__todos__' ? ' ativo' : '');
  todos.innerHTML = `<span class="nome">📢 Todos</span>`;
  todos.addEventListener('click', () => selecionarContato('__todos__'));
  container.appendChild(todos);
  const lista = Array.from(usuariosChat).sort();
  lista.forEach(nome => {
    const div = document.createElement('div');
    div.className = 'user' + (estado.contatoAtivo === nome ? ' ativo' : '');
    const naoLidasCount = naoLidas.get(nome) || 0;
    div.innerHTML = `
      <span class="dot"></span>
      <span class="nome">${nome}</span>
      ${naoLidasCount > 0 ? `<span class="contador">${naoLidasCount}</span>` : ''}
    `;
    div.addEventListener('click', () => selecionarContato(nome));
    container.appendChild(div);
  });
}

function selecionarContato(nome) {
  estado.contatoAtivo = nome;
  if (nome !== '__todos__') naoLidas.set(nome, 0);
  let total = 0;
  for (const v of naoLidas.values()) total += v;
  const badge = document.getElementById('badgeMensagens');
  if (total > 0) { badge.textContent = total; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
  renderizarListaContatos();
  renderizarMensagens();
  document.getElementById('inputChat').focus();
}

function renderizarMensagens() {
  const container = document.getElementById('chatMensagens');
  container.innerHTML = '';
  if (!estado.contatoAtivo) {
    const vazio = document.createElement('div');
    vazio.className = 'vazio';
    vazio.textContent = 'Selecione um contato para ver as mensagens';
    container.appendChild(vazio);
    return;
  }
  let mensagens = [];
  if (estado.contatoAtivo === '__todos__') {
    for (const lista of conversas.values()) mensagens = mensagens.concat(lista);
    mensagens.sort((a, b) => (a.time || 0) - (b.time || 0));
  } else {
    mensagens = conversas.get(estado.contatoAtivo) || [];
  }
  if (mensagens.length === 0) {
    const vazio = document.createElement('div');
    vazio.className = 'vazio';
    vazio.textContent = 'Nenhuma mensagem ainda';
    container.appendChild(vazio);
    return;
  }
  mensagens.forEach(msg => {
    const div = document.createElement('div');
    const ehEnviada = msg.role === 'broadcaster';
    div.className = 'msg ' + (ehEnviada ? 'enviada' : 'recebida');
    if (msg.target) div.classList.add('privada');
    const hora = new Date(msg.time || Date.now()).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `
      <span class="autor">${ehEnviada ? 'você' : msg.user}${msg.target ? ' 🔒' : ''}</span>
      ${msg.text}
      <span class="hora">${hora}</span>
    `;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

/* ==========================================================
   ENVIO DE MENSAGEM
   ========================================================== */
document.getElementById('btnEnviarChat').addEventListener('click', enviarMsgChat);
document.getElementById('inputChat').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') enviarMsgChat();
});

function enviarMsgChat() {
  const input = document.getElementById('inputChat');
  const texto = input.value.trim();
  if (!texto) return;
  if (!estado.contatoAtivo) { alert('Selecione um contato primeiro!'); return; }
  const target = estado.contatoAtivo === '__todos__' ? null : estado.contatoAtivo;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'chat', user: estado.usuario, text: texto, target,
    }));
  }
  const msg = {
    type: 'chat', user: estado.usuario, text: texto,
    role: 'broadcaster', target, time: Date.now(),
  };
  const contato = target || 'locutor';
  if (!conversas.has(contato)) conversas.set(contato, []);
  conversas.get(contato).push(msg);
  input.value = '';
  renderizarMensagens();
  input.focus();
}
</script>
